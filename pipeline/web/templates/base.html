<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}web-timeline{% endblock %}</title>
<style>
  :root { --bg:#0f1117; --card:#181b24; --border:#262b38; --fg:#e6e9ef; --muted:#8b93a7; --accent:#4f8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  nav { display:flex; align-items:center; gap:20px; padding:14px 28px; border-bottom:1px solid var(--border); background:#141824; position:sticky; top:0; z-index:10; }
  nav .brand { font-weight:700; font-size:16px; letter-spacing:.3px; }
  nav .brand span { color:var(--accent); }
  nav a.link { color:var(--muted); font-size:13px; }
  nav a.link.active, nav a.link:hover { color:var(--fg); text-decoration:none; }
  nav .spacer { flex:1; }
  nav .cta { background:var(--accent); color:#fff; padding:7px 14px; border-radius:8px; font-size:13px; font-weight:600; }
  nav .cta:hover { text-decoration:none; filter:brightness(1.08); }
  main { padding:26px 28px; max-width:1200px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:22px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge-active { background:#7c1d1d; color:#fee; }
  .badge-passive { background:#1f3a24; color:#d9f5e0; }
  .sev { display:inline-block; padding:1px 7px; border-radius:5px; color:#fff; font-size:11px; font-weight:700; }
  .btn { background:var(--accent); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn:hover { filter:brightness(1.08); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<nav>
  <a class="brand" href="/">web<span>·</span>timeline</a>
  <a class="link {% block nav_dash %}{% endblock %}" href="/">Dashboard</a>
  <a class="link {% block nav_new %}{% endblock %}" href="/new">New scan</a>
  <span class="spacer"></span>
  <a class="cta" href="/new">+ New scan</a>
</nav>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
