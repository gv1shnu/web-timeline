# web-timeline — default configuration.
# Every key is optional; anything omitted falls back to the built-in defaults
# in pipeline/config.py. Pass with:  python recon.py example.com -c config.yaml

# --- global / tier ceiling ---
output_dir: output
active: false            # active tier: scanning + SQLi/XSS detection (or --active)
offensive: false         # offensive tier: exploitation (or --exploit; implies active)
threads: 40
rate_limit: 150          # req/s cap for tools that honour it
resolvers:
  - 1.1.1.1
  - 8.8.8.8
  - 9.9.9.9

# --- which stages run ---
stages:
  subdomains: true
  resolve: true
  ports: true            # ACTIVE
  http_probe: true
  crawl: true
  screenshots: true
  vulns: true            # ACTIVE
  sqli_detect: true      # ACTIVE  (sqlmap detection)
  xss_detect: true       # ACTIVE  (dalfox detection)
  exploits: true         # passive: look up public exploits for CVE findings
  sqli_exploit: true     # OFFENSIVE (sqlmap --dump)
  xss_confirm: true      # OFFENSIVE (dalfox triggered-payload proof)
  auth_attack: true      # OFFENSIVE (hydra)
  exploit_run: true      # OFFENSIVE (nuclei CVE templates; PoCs/MSF staged)
  crack: true            # OFFENSIVE (john)

# --- subdomain discovery ---
subfinder_all_sources: true
amass_enabled: false     # amass passive is thorough but slow
include_crtsh: true

# --- port scanning ---
ports: "top-1000"        # "top-1000" | "1-65535" | "80,443,8080-8090"
port_scan_tool: naabu    # naabu | nmap
nmap_service_scan: true  # run nmap -sV on discovered ports for versions

# --- vulnerability scanning (nuclei) ---
nuclei_severity: "low,medium,high,critical"
nuclei_tags: ""          # e.g. "cve,exposure,misconfig"
nuclei_rate_limit: 150

# --- exploit enrichment ---
exploit_sources:         # where to look up exploits for CVE findings
  - searchsploit         # offline Exploit-DB (needs `exploitdb` installed)
  - github               # trickest/cve -> GitHub PoC map (HTTPS, no key)
exploits_per_finding: 15 # cap exploit links attached to each finding

# --- crawling ---
crawl_depth: 2
crawl_tools:
  - katana
  - waybackurls
  - gau

# --- screenshots ---
screenshot_timeout: 15

# --- SQL injection (sqlmap) ---
sqli_max_urls: 50            # cap parameterized URLs tested
sqlmap_level: 1             # --level 1-5 (test depth)
sqlmap_risk: 1              # --risk 1-3 (payload aggressiveness)
sqlmap_dump: true          # OFFENSIVE: extract data from injectable params
sqlmap_dump_max_rows: 100  # --stop cap per table (bounds extraction)
sqlmap_os_shell: false     # OFFENSIVE (opt-in): attempt OS command execution

# --- cross-site scripting (dalfox) ---
xss_max_urls: 100
dalfox_workers: 40
xss_blind_callback: ""      # OFFENSIVE (opt-in): out-of-band host for blind XSS

# --- credential attacks (hydra) ---
auth_userlist: ""           # usernames file; empty = small built-in common set
auth_passlist: ""           # passwords file; empty = small built-in common set
auth_max_targets: 10
auth_form: ""               # optional hydra http-post-form spec for form logins
auth_stop_on_success: true

# --- CVE exploitation (exploit_run) ---
exploit_run_engines:        # vetted auto-exec engines only
  - nuclei
exploit_run_max_cves: 25
exploit_run_stage_pocs: true   # write per-CVE PoC pointer manifest (not executed)
exploit_run_msf_script: true   # emit a Metasploit resource script (staged, not run)

# --- password cracking (john) ---
crack_wordlist: ""          # wordlist path; empty = john default mode
crack_max_hashes: 500
crack_format: ""            # force a john --format (empty = auto-detect)

# --- per-stage timeouts (seconds) ---
timeouts:
  subdomains: 600
  resolve: 300
  ports: 1800
  http_probe: 600
  crawl: 900
  screenshots: 900
  vulns: 3600
  sqli_detect: 1800
  xss_detect: 1800
  exploits: 600
  sqli_exploit: 3600
  xss_confirm: 1800
  auth_attack: 1800
  exploit_run: 3600
  crack: 3600
